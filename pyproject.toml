[project]
name = "fenrir"
version = "0.1.0"
description = "Azure identity enumeration and managed-identity exploitation toolkit for authorized security testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "msal>=1.24", "rich", "requests>=2.31"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
fenrir = "fenrir.cli:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
